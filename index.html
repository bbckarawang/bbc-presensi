<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BBC Presensi</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#b91c1c">
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1xp4tsE6RhaxXFSC7XQN45_3TOdUsUe5j">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background-color: #b91c1c; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- MASUKKAN LINK DEPLOYMENT GOOGLE APPS SCRIPT KAMU DI DALAM TANDA PETIK SRC DI BAWAH -->
  <iframe id="gasIframe" src="https://script.google.com/macros/s/AKfycbxOKA4OtyYlRUjjdL6gUjotvcQkDDea3G5vqMwMGjkCNTOxlP5-nvD-SpfvIP5fA6c/exec"></iframe>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
    }

    // Mencegah tombol Back keluar aplikasi tanpa konfirmasi
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
      const confirmExit = confirm("Are you sure you want to exit the application?");
      if (confirmExit) {
        history.back();
      } else {
        history.pushState(null, null, location.href);
      }
    };

    // Konfirmasi saat halaman hendak ditutup/di-refresh
    window.addEventListener("beforeunload", function (e) {
      const confirmationMessage = "Are you sure you want to leave?";
      (e || window.event).returnValue = confirmationMessage;
      return confirmationMessage;
    });
  </script>
</body>
</html>
